name: Cron tick

# Vercel Hobby caps cron jobs at once per day, but reminders and live score
# alerts need a frequent heartbeat. This pings /api/cron/tick every 5 minutes
# (GitHub's minimum; actual runs can lag a few minutes at busy times).
# The endpoint is idempotent — ReminderLog claims dedupe everything — so
# overlapping or delayed runs are safe.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping tick endpoint
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://sooncast.vercel.app/api/cron/tick)
          echo "HTTP $code"
          cat /tmp/body
          [ "$code" = "200" ]
